<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME-FIT</title>

    <link rel="stylesheet" href="/Prime-fit/cuenta.css">
</head>

<body>

   
    <header>
        <div class="logo">PRIME-FIT</div>
    </header>


    <main class="contenedor">

        
        <aside class="menu">

            <div class="menu-titulo">
                INFORMACIÓN DE LA CUENTA
            </div>

            <div class="menu-opcion">
                CAMBIAR FOTO
            </div>

            <div class="menu-opcion">
                CAMBIAR CONTRASEÑA
            </div>

            <div class="menu-opcion">
                PLANES DE SUSCRIPCIÓN
            </div>

            <div class="menu-opcion">
                MIEMBROS AFILIADOS
            </div>

            <div class="menu-opcion">
                ADMINISTRAR SUSCRIPCIONES
            </div>

            <div class="menu-opcion">
                ESTADÍSTICAS DEL GIMNASIO
            </div>

        </aside>


        
        <section class="cuenta">

            <h1>Cuenta</h1>

            <p class="subtitulo">
                Información de la Cuenta
            </p>


           
            <div class="campos">

                <input type="text" placeholder="Nombres">

                <input type="text" placeholder="Apellidos">


                <input
                    type="text"
                    class="azul"
                    placeholder="Edad"
                >

                <input
                    type="text"
                    class="azul"
                    placeholder="Sexo"
                >


                <input
                    type="text"
                    class="azul"
                    placeholder="Estatura"
                >

                <input
                    type="text"
                    class="azul"
                    placeholder="Peso"
                >


                <input
                    type="text"
                    placeholder="Teléfono"
                >

                <input
                    type="text"
                    class="azul"
                    placeholder="Correo electrónico"
                >


                <input
                    type="text"
                    placeholder="Usuario"
                >

            </div>


            <div class="usuario">

                <div class="icono">
                    PF
                </div>

                <div class="nombre-usuario">
                    prime-fit
                </div>

            </div>


            <button class="actualizar">
                ACTUALIZAR INFORMACIÓN
            </button>

        </section>

    </main>

</body>
</html>
