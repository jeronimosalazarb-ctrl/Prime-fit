<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planes - PRIME-FIT</title>
<link rel="stylesheet" href="../css/planes.css">
</head>
<body>

<div class="barra-amarilla"></div>
<div class="logo-top">PRIME-FIT</div>

<div class="contenedor-blanco">
  <div class="navegacion">
    <a href="cuenta.html">INFORMACIÓN DE LA CUENTA</a>
    <a href="#">CAMBIAR FOTO</a>
  </div>

  <div class="card-planes">
    <h2>Planes de suscripción</h2>
    <p class="descripcion">Consulta y selecciona el plan que deseas utilizar.</p>

    <label class="label-select">Elige tu plan</label>
    <div class="selector-plan">
      <select id="planSelect">
        <option value="basic">Plan Básico - $120.000 / 30 días</option>
        <option value="power">Power Prime-Fit - $220.000 / 75 días</option>
        <option value="ultra">Ultra Prime-Fit - $500.000 / 200 días</option>
      </select>
    </div>

    <div class="info-plan" id="infoPlan">
      <div class="fila-info"><span>Costo:</span> <strong id="costo">$120.000</strong></div>
      <div class="fila-info"><span>Duración:</span> <strong id="duracion">30 días</strong></div>
      <div class="fila-info"><span>Beneficios:</span> <span id="beneficios">Acceso a gimnasio</span></div>
    </div>

    <button class="btn-seleccionar" id="btnSeleccionar">SELECCIONAR PLAN</button>
  </div>
</div>

<div class="barra-amarilla-bottom"></div>
<div class="barra-negra"></div>

</body>

</html>
