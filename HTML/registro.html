<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - PRIME-FIT</title>
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>

    <div class="card-registro">
        <h1>PRIME-FIT</h1>
        <p class="sub">Registrate en PRIME-FIT</p>

        <form id="formRegistro">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="email" id="correo" placeholder="Correo electrónico" required>
            <input type="password" id="pass" placeholder="Contraseña" required>
            <input type="password" id="pass2" placeholder="Confirmar contraseña" required>

            <button type="submit" class="btn-registrarse">REGISTRAR</button>
        </form>

        <p class="link-abajo">¿Ya tienes cuenta? <a href="login.html">INICIA SESION</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/registro.js"></script>
</body>
</html>
