<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIME-FIT - Registro</title>
  <link rel="stylesheet" href="../css/login.css">
</head>

<body>
  <div class="franja"></div>
  <div class="container">
    <div class="login-card">
      <h1 class="logo">PRIME-FIT</h1>
      <p class="subtitle">Inicia sesion en PRIME-FIT</p>
      <form id="formRegistro">
        <div class="input-group">
          <input type="text" id="nombre" placeholder="Nombre completo" required>
        </div>
        <div class="input-group">
          <input type="email" id="emailReg" placeholder="Correo electrónico" required>
        </div>
        <div class="input-group">
          <input type="password" id="passReg" placeholder="Contraseña" required>
        </div>
        <div class="input-group">
          <input type="password" id="passReg2" placeholder="Confirmar contraseña" required>
        </div>
        <button type="submit" class="btn-principal">CONTINUAR</button>

      </form>
    </div>
  </div>
  <div class="franja"></div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/login.js"></script>



</body>

</html>
