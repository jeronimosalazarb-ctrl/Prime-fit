<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME-FIT - Inscribir Coach</title>
    <link rel="stylesheet" href="/inscribir coach.css">
</head>
<body>

    <h1 class="header-title">PRIME-FIT</h1>

    <div class="card">
        <h2 class="card-title">INSCRIBIR COACH</h2>

        <form>
            <div class="section-label">Datos de la cuenta</div>

            <div class="form-row">
                <div class="input-group">
                    <input type="text" placeholder="Usuario" required>
                </div>
                <div class="input-group">
                    <input type="tel" placeholder="Teléfono" required>
                </div>
            </div>

            <div class="input-group full-width">
                <input type="email" placeholder="Correo electrónico" required>
            </div>

            <div class="section-label security-section">Seguridad</div>

            <div class="form-row">
                <div class="input-group">
                    <input type="password" placeholder="Contraseña" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Confirmar" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">CONTINUAR</button>

            <div class="footer-text">
                ¿Ya tienes una cuenta PRIME-FIT? <a href="#">Inicia sesión</a>
            </div>
        </form>
    </div>

</body>
</html>
