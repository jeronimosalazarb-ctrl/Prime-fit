<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIME-FIT | Login</title>
<link rel="stylesheet" href="../css/administrador.css">
</head>
<body>

  <div class="barra-negra-top"></div>

  <div class="fondo-amarillo">
    <div class="login-card">
      <h1 class="logo">PRIME-FIT</h1>
      
      <p class="subtitle">Inicia sesión en tu cuenta de PRIME-FIT<br><span class="admin">ADMINISTRADOR</span></p>

      <form>
        <div class="input-group">
          <input type="email" placeholder="Correo electrónico" required>
        </div>

        <div class="input-group">
          <input type="password" placeholder="Contraseña" required>
        </div>

        <div class="opciones">
          <label class="remember">
            <input type="checkbox"> Recuérdame
          </label>
          <a href="#" class="link">Recuperar contraseña</a>
        </div>

        <button type="submit" class="btn-login">INICIAR SESIÓN</button>

        <p class="registro">¿No tienes una cuenta en PRIME-FIT? <a href="#">Registrar</a></p>
      </form>
    </div>
  </div>

  <div class="barra-negra-bottom"></div>

</body>
</html>
